name: Build Opus-Tools

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this upstream commit was already built successfully."
        required: false
        type: boolean
        default: false
      tag_name:
        description: "Tag name for the release (leave empty to use version from repository)"
        required: false
        default: ""
      opus_tools_ref:
        description: "Branch, tag, or commit of xiph/opus-tools to build"
        required: true
        default: "master"

permissions:
  contents: write
  actions: write

jobs:
  check_upstream:
    name: Check upstream update
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Resolve upstream revision
        id: upstream
        run: |
          set -euo pipefail
          git init --quiet /tmp/upstream-resolve
          git -C /tmp/upstream-resolve remote add origin "https://github.com/xiph/opus-tools.git"
          git -C /tmp/upstream-resolve fetch --depth=1 origin HEAD
          SHA="$(git -C /tmp/upstream-resolve rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -z "${SHA}" ]]; then
            echo "Could not resolve upstream revision." >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Restore build marker
        id: built_cache
        uses: actions/cache/restore@v5
        with:
          path: .upstream-build-cache
          key: opus-tools-${{ steps.upstream.outputs.sha }}

      - name: Decide whether to build
        id: decision
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "pull_request" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ steps.built_cache.outputs.cache-hit }}" == "true" ]]; then
            SHOULD_BUILD="false"
            echo "Upstream commit ${{ steps.upstream.outputs.sha }} was already built successfully."
          else
            SHOULD_BUILD="true"
          fi
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux 64-bit
    needs: check_upstream
    if: needs.check_upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: "xiph/opus-tools"
          ref: ${{ github.event.inputs.opus_tools_ref || needs.check_upstream.outputs.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libflac-dev \
            libogg-dev \
            libopus-dev \
            libopusenc-dev \
            libopusfile-dev \
            libtool \
            pkg-config

      - name: Get version from repository
        id: get_version
        run: |
          ./update_version || true
          if [ -f package_version ]; then
            source package_version
            # Strip v prefix if it exists to normalize it
            CLEAN_VERSION=$(echo "$PACKAGE_VERSION" | sed 's/^v//')
            echo "version=v$CLEAN_VERSION" >> $GITHUB_OUTPUT
            echo "VERSION=v$CLEAN_VERSION" >> $GITHUB_ENV
          else
            VERSION=$(git describe --tags --always || echo "unknown")
            CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
            echo "version=v$CLEAN_VERSION" >> $GITHUB_OUTPUT
            echo "VERSION=v$CLEAN_VERSION" >> $GITHUB_ENV
          fi

      - name: Configure and Build
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)

      - name: Package Binaries
        run: |
          mkdir -p dist
          cp opusdec opusenc opusinfo dist/
          tar -czvf opus-tools-linux64.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: opus-tools-linux64
          path: opus-tools-linux64.tar.gz
          retention-days: 7

  build-windows:
    name: Build Windows 64-bit
    needs: check_upstream
    if: needs.check_upstream.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: "xiph/opus-tools"
          ref: ${{ github.event.inputs.opus_tools_ref || needs.check_upstream.outputs.sha }}
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libopusenc
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-toolchain

      - name: Configure and Build Statically
        shell: msys2 {0}
        run: |
          ./autogen.sh
          ./configure --enable-static --disable-shared LDFLAGS="-static"
          make -j$(nproc)

      - name: Package Binaries
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp opusdec.exe opusenc.exe opusinfo.exe dist/
          tar -czvf opus-tools-windows64.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: opus-tools-windows64
          path: opus-tools-windows64.tar.gz
          retention-days: 7

  release:
    name: Release Binaries
    needs: [check_upstream, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: opus-tools-linux64
          path: artifacts

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: opus-tools-windows64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || needs.build-linux.outputs.version }}
          name: opus-tools ${{ github.event.inputs.tag_name || needs.build-linux.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Automated build for xiph/opus-tools.

            Upstream version: ${{ needs.build-linux.outputs.version }}
            Upstream commit: ${{ needs.check_upstream.outputs.sha }}
            Build details:
            - Linux: standard dynamic build
            - Windows: statically-linked build (LDFLAGS="-static") using MSYS2 / MinGW-w64
            Platforms: Linux x64, Windows x64
          files: |
            artifacts/opus-tools-linux64.tar.gz
            artifacts/opus-tools-windows64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create build marker
        run: touch .upstream-build-cache

      - name: Save build marker to cache
        uses: actions/cache/save@v5
        with:
          path: .upstream-build-cache
          key: opus-tools-${{ needs.check_upstream.outputs.sha }}
