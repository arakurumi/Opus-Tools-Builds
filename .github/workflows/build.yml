name: Build Opus-Tools

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this upstream commit was already built successfully."
        required: false
        type: boolean
        default: false
      tag_name:
        description: "Tag name for the release (leave empty to use version from repository)"
        required: false
        default: ""
      opus_tools_ref:
        description: "Branch, tag, or commit of xiph/opus-tools to build"
        required: true
        default: "master"

permissions:
  contents: write
  actions: write

jobs:
  check_upstream:
    name: Check upstream update
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      cache_hit: ${{ steps.built_cache.outputs.cache-hit }}
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Resolve upstream revision
        id: upstream
        run: |
          set -euo pipefail
          git init --quiet /tmp/upstream-resolve
          git -C /tmp/upstream-resolve remote add origin "https://github.com/xiph/opus-tools.git"
          git -C /tmp/upstream-resolve fetch --depth=1 origin HEAD
          SHA="$(git -C /tmp/upstream-resolve rev-parse 'FETCH_HEAD^{commit}')"
          if [[ -z "${SHA}" ]]; then
            echo "Could not resolve upstream revision." >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Restore build marker
        id: built_cache
        uses: actions/cache/restore@v5
        with:
          path: .upstream-build-cache
          key: opus-tools-${{ steps.upstream.outputs.sha }}

      - name: Decide whether to build
        id: decision
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force }}" == "true" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "pull_request" ]]; then
            SHOULD_BUILD="true"
          elif [[ "${{ steps.built_cache.outputs.cache-hit }}" == "true" ]]; then
            SHOULD_BUILD="false"
            echo "Upstream commit ${{ steps.upstream.outputs.sha }} was already built successfully."
          else
            SHOULD_BUILD="true"
          fi
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs: check_upstream
    if: needs.check_upstream.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact: opus-tools-linux64
          - name: Windows x64
            runner: windows-latest
            artifact: opus-tools-windows64
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            build-essential \
            gettext \
            libtool \
            libtool-bin \
            pkg-config

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-toolchain

      - name: Build static dependencies (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-deps.sh

      - name: Build static dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-deps.sh

      - name: Clone upstream
        run: |
          git clone https://github.com/xiph/opus-tools.git source
          cd source
          git checkout "${{ github.event.inputs.opus_tools_ref || needs.check_upstream.outputs.sha }}"

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build-app.sh

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-app.sh

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package.sh

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/package.sh

      - name: Read package version
        id: package_meta
        shell: bash
        run: |
          upstream_version="$(cat package/version.txt | head -n1)"
          safe_version="$(echo "${upstream_version}" | sed -E 's/[^A-Za-z0-9._+-]+/-/g; s/^-+//; s/-+$//')"
          echo "upstream_version=${upstream_version}" >> $GITHUB_OUTPUT
          echo "safe_version=${safe_version}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ steps.package_meta.outputs.safe_version }}
          path: package/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs:
      - check_upstream
      - build
    if: needs.check_upstream.outputs.should_build == 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-input

      - name: Prepare release assets
        id: release_meta
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact_dir in release-input/*; do
            artifact_name="$(basename "${artifact_dir}")"
            tar -czf "release-assets/${artifact_name}.tar.gz" -C "${artifact_dir}" .
          done

          version_file="$(find release-input -name version.txt -print -quit)"
          upstream_version="$(cat "${version_file}" | head -n1)"
          safe_version="$(echo "${upstream_version}" | sed -E 's/[^A-Za-z0-9._+-]+/-/g; s/^-+//; s/-+$//')"

          # Custom release title (optional user tag input override)
          USER_TAG="${{ github.event.inputs.tag_name }}"
          if [[ -n "${USER_TAG}" ]]; then
            RELEASE_TAG="${USER_TAG}"
            RELEASE_TITLE="opus-tools ${USER_TAG}"
          else
            RELEASE_TAG="opus-tools-${safe_version}"
            RELEASE_TITLE="opus-tools ${upstream_version}"
          fi

          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "upstream_version=${upstream_version}" >> $GITHUB_OUTPUT

          cat > release-notes.md <<EOF
          Automated build for xiph/opus-tools.

          Upstream version: ${upstream_version}
          Upstream commit: ${{ needs.check_upstream.outputs.sha }}
          Build arguments: \`--enable-static --disable-shared PKG_CONFIG="pkg-config --static" LDFLAGS="-all-static" (Linux) / LDFLAGS="-static" (Windows)\`
          Platforms: Linux x64, Windows x64
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.release_title }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "${RELEASE_TITLE}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}"
          fi

  mark_built:
    name: Mark upstream commit as built
    needs:
      - check_upstream
      - build
      - release
    if: needs.check_upstream.outputs.should_build == 'true' && needs.check_upstream.outputs.cache_hit != 'true' && success()
    runs-on: ubuntu-latest
    steps:
      - name: Create build marker
        run: |
          set -euo pipefail
          mkdir -p .upstream-build-cache
          echo "${{ needs.check_upstream.outputs.sha }}" > .upstream-build-cache/upstream-sha.txt

      - name: Save build marker
        uses: actions/cache/save@v5
        with:
          path: .upstream-build-cache
          key: opus-tools-${{ needs.check_upstream.outputs.sha }}
